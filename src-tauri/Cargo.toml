[package]
name = "firm-panel-desktop"
# The released version is computed by scripts/next-version.mjs from the commits and written here at build time only.
version = "0.0.0"
description = "Desktop shell of the firm panel: one window on the hosted application, kept up to date on its own."
authors = ["Wasied"]
license = "UNLICENSED"
edition = "2021"
publish = false

[lib]
name = "firm_panel_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-updater = "=2.14.1"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
