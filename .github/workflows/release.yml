# One pipeline from a push to the installed applications:
#   check (every push and pull request) -> version (main) -> draft release -> build on macOS, Windows and Linux, each
#   uploading its installers to the draft -> publish (latest.json from the files of the draft, then public) -> verify.
# A release happens only when the commits since the last one ask for it (scripts/version.mjs) and every check passed.
# Installed applications find it on their own: they read releases/latest/download/latest.json at start and every 4 h.
# No file goes through the artifact storage of GitHub (capped for the organisation): the draft release carries them,
# and a draft is seen neither by the public nor by the updater ("latest" only ever names a published release).
name: release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repository checks (start page, long dashes)
        run: npm run check
      - name: Release scripts (version, signatures)
        run: npm test
      - name: System libraries of the Linux webview
        timeout-minutes: 12
        run: scripts/apt-webview.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Lint
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked

  version:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
      previous: ${{ steps.next.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: next
        run: node scripts/next-version.mjs

  draft:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: A draft left by a failed run of this version is discarded, a published one stops the run
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"v$VERSION\") | \"\(.id) \(.draft)\"" > same-tag.txt
          cat same-tag.txt
          while read -r id draft; do
            if [ "$draft" != "true" ]; then
              echo "::error::v$VERSION is already published (release $id)"
              exit 1
            fi
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            echo "discarded the draft $id"
          done < same-tag.txt
      - id: create
        name: Draft release (no tag until it is published, invisible to the public and to the updater)
        run: |
          id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" \
            -f name="Panel du cabinet $VERSION" -F draft=true --jq .id)"
          echo "draft release $id for v$VERSION at $GITHUB_SHA"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: [version, draft]
    if: needs.version.outputs.release == 'true'
    environment: production
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: macos
            os: macos-15
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - platform: windows
            os: windows-2025
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: linux
            # The oldest supported Ubuntu: an AppImage runs on systems at least as recent as the one it was built on.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # The token of this job may write releases: it is given to the upload step only, never left in .git/config
      # where the build (npm packages, crate build scripts) could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: matrix.platform == 'linux'
        timeout-minutes: 12
        run: scripts/apt-webview.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: node scripts/set-version.mjs "${{ needs.version.outputs.version }}"
      - name: Signing identity of macOS (Developer ID when configured, ad hoc otherwise)
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then echo "MAC_SIGNED=1" >> "$GITHUB_ENV"; else echo "MAC_SIGNED=0" >> "$GITHUB_ENV"; fi
      - name: Write the App Store Connect key for notarisation
        if: matrix.platform == 'macos' && env.MAC_SIGNED == '1'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key_file="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_file"
          echo "APPLE_API_KEY_PATH=$key_file" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ "${{ matrix.platform }}" = "macos" ] && [ "$MAC_SIGNED" != "1" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY
          fi
          npx tauri build --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
      # A Mac release with the Developer ID secrets must open without any warning: signed by the team, hardened runtime,
      # notarised and stapled, accepted by Gatekeeper as an application downloaded from the Internet. Anything less fails.
      - name: Verify the macOS signature, notarisation and Gatekeeper verdict
        if: matrix.platform == 'macos' && env.MAC_SIGNED == '1'
        shell: bash
        run: |
          app=$(ls -d src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          details=$(codesign -dvv "$app" 2>&1)
          echo "$details" | grep -E "Authority=Developer ID Application|TeamIdentifier|flags|Timestamp"
          echo "$details" | grep -q "Authority=Developer ID Application: .*(GRLD263F65)" || { echo "not signed by the team's Developer ID"; exit 1; }
          echo "$details" | grep -q "flags=.*runtime" || { echo "the hardened runtime is missing"; exit 1; }
          xcrun stapler validate "$app"
          spctl --assess --type execute -vv "$app" 2>&1 | tee gatekeeper.txt
          grep -q "source=Notarized Developer ID" gatekeeper.txt || { echo "Gatekeeper does not accept the application"; exit 1; }
      # Tauri notarises the application, not the disk image around it: a downloaded image that is signed but not
      # notarised is rejected when it is opened (measured on a Mac on 2026-11-16, release 0.1.2). The image goes to the
      # notary too, gets its ticket stapled, and must be accepted the way a downloaded file is opened.
      - name: Notarise and staple the disk image
        if: matrix.platform == 'macos' && env.MAC_SIGNED == '1'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          dmg=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait --timeout 30m --output-format json | tee notary.json
          grep -q '"status" *: *"Accepted"' notary.json || { echo "the notary did not accept the disk image"; exit 1; }
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature -vv "$dmg" 2>&1 | tee gatekeeper-dmg.txt
          grep -q "source=Notarized Developer ID" gatekeeper-dmg.txt || { echo "Gatekeeper does not accept the disk image"; exit 1; }
      - name: Gather the installers
        shell: bash
        run: node scripts/collect-bundles.mjs "${{ matrix.platform }}" "${{ needs.version.outputs.version }}" "${{ matrix.target }}"
      # The content type of each file is set here, not guessed from the system of the runner (gh asks the registry on
      # Windows): the release keeps exactly the types of v0.1.0 and v0.1.1, whatever machine uploads.
      - name: Upload the installers to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.id }}
        run: |
          for file in dist/*; do
            name="${file##*/}"
            case "$name" in
              *.app.tar.gz) type=application/x-gtar ;;
              *.dmg) type=application/x-apple-diskimage ;;
              *.exe) type=application/octet-stream ;;
              *.sig) type=application/pgp-signature ;;
              *.AppImage) type=application/vnd.appimage ;;
              *.deb) type=application/x-debian-package ;;
              *) echo "::error::no content type for $name"; exit 1 ;;
            esac
            for attempt in 1 2 3; do
              # A re-run, or an upload cut short, leaves an asset of that name on the draft: it goes first.
              for asset in $(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
                --jq ".[] | select(.name == \"$name\") | .id"); do
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset"
              done
              rm -f upload.json
              if curl --fail-with-body --silent --show-error --max-time 1200 --output upload.json \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --header "Content-Type: $type" \
                --data-binary "@$file" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name&label="; then
                echo "uploaded $name ($type, $(wc -c < "$file" | tr -d ' ') bytes)"
                continue 2
              fi
              cat upload.json || true
              echo "upload of $name failed (attempt $attempt of 3)"
            done
            echo "::error::could not upload $name"
            exit 1
          done

  publish:
    needs: [version, draft, build]
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PREVIOUS: ${{ needs.version.outputs.previous }}
      RELEASE_ID: ${{ needs.draft.outputs.id }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: The release of this run is still a draft, and the one gh finds under v${{ needs.version.outputs.version }}
        run: |
          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .draft)"
          if [ "$draft" != "true" ]; then echo "::error::release $RELEASE_ID is no longer a draft"; exit 1; fi
          found="$(gh release view "v$VERSION" --json databaseId,isDraft --jq '"\(.databaseId) \(.isDraft)"')"
          if [ "$found" != "$RELEASE_ID true" ]; then echo "::error::v$VERSION resolves to $found, expected $RELEASE_ID true"; exit 1; fi
      - name: The installers, as they are on the draft
        run: |
          gh release download "v$VERSION" --dir dist
          ls -l dist
          # The unversioned names behind releases/latest/download/<name> are the same bytes as the versioned ones.
          cmp "dist/Panel-du-cabinet-macos.dmg" "dist/Panel-du-cabinet-$VERSION-macos-universal.dmg"
          cmp "dist/Panel-du-cabinet-windows-setup.exe" "dist/Panel-du-cabinet-$VERSION-windows-x64-setup.exe"
          cmp "dist/Panel-du-cabinet-linux.AppImage" "dist/Panel-du-cabinet-$VERSION-linux-x86_64.AppImage"
      - name: Release notes (the commits since the last release)
        run: |
          range="HEAD"; if [ -n "$PREVIOUS" ]; then range="v$PREVIOUS..HEAD"; fi
          git log --no-merges --format='- %s' "$range" > notes.md
          cat notes.md
      - run: node scripts/latest-json.mjs "$VERSION" notes.md
      - name: Every file is signed by the key built into the application
        run: node scripts/verify-release.mjs local "$VERSION"
      - name: Upload latest.json to the draft
        run: gh release upload "v$VERSION" dist/latest.json --clobber
      - name: The draft holds exactly the files of a release, fully uploaded, with their usual types
        run: |
          expected="$(sort <<EOF
          latest.json application/json uploaded
          Panel-du-cabinet-$VERSION-linux-amd64.deb application/x-debian-package uploaded
          Panel-du-cabinet-$VERSION-linux-x86_64.AppImage application/vnd.appimage uploaded
          Panel-du-cabinet-$VERSION-linux-x86_64.AppImage.sig application/pgp-signature uploaded
          Panel-du-cabinet-$VERSION-macos-universal.app.tar.gz application/x-gtar uploaded
          Panel-du-cabinet-$VERSION-macos-universal.app.tar.gz.sig application/pgp-signature uploaded
          Panel-du-cabinet-$VERSION-macos-universal.dmg application/x-apple-diskimage uploaded
          Panel-du-cabinet-$VERSION-windows-x64-setup.exe application/octet-stream uploaded
          Panel-du-cabinet-$VERSION-windows-x64-setup.exe.sig application/pgp-signature uploaded
          Panel-du-cabinet-linux.AppImage application/vnd.appimage uploaded
          Panel-du-cabinet-macos.dmg application/x-apple-diskimage uploaded
          Panel-du-cabinet-windows-setup.exe application/octet-stream uploaded
          EOF
          )"
          actual="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | "\(.name) \(.content_type) \(.state)"' | sort)"
          if [ "$actual" != "$expected" ]; then
            diff <(echo "$expected") <(echo "$actual") || true
            echo "::error::the draft does not hold the expected files"
            exit 1
          fi
          echo "$actual"
      - name: Publish (notes, public and latest in one change)
        run: gh release edit "v$VERSION" --notes-file notes.md --draft=false --latest
      - name: The public update file names this version and every file passes
        run: node scripts/verify-release.mjs public "$VERSION"
